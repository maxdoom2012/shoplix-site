<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoplix — Shared shopping list app that syncs in real time</title>
  <meta name="description" content="Free shared shopping list app for families and events. Add, claim, and check off items in real time so nobody buys twice — on iOS, Android, and the web." />
  <link rel="canonical" href="https://shoplix.app/en/" />
  <link rel="alternate" hreflang="en" href="https://shoplix.app/en/" />
  <link rel="alternate" hreflang="uk" href="https://shoplix.app/uk/" />
  <link rel="alternate" hreflang="x-default" href="https://shoplix.app/en/" />
  <link rel="icon" type="image/png" href="/app-icon.png" />
  <meta http-equiv="refresh" content="0; url=/en/" />
  <script>
    (function () {
      var l = (navigator.language || navigator.userLanguage || '').toLowerCase();
      location.replace(l.indexOf('uk') === 0 ? '/uk/' : '/en/');
    })();
  </script>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:24px">
    Redirecting to Shoplix — <a href="/en/">English</a> · <a href="/uk/">Українською</a>.

</html>
